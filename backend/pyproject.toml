[tool.ruff]
line-length = 120
target-version = "py312"
# Autogenerated Alembic migrations — not hand-written, don't lint their style.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...) in argument defaults is the standard FastAPI idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
